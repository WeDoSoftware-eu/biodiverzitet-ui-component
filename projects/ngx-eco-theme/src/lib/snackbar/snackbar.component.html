<div class="snackbar-container gap-16 rounded-8" [ngClass]="'snackbar-' + data.type">
  <div class="snackbar-content gap-16 p-x-16 p-y-8">
    <eco-icon class="snackbar-icon" [icon]="getIcon()"></eco-icon>
    <span class="snackbar-message">{{ data.message }}</span>
    <eco-icon class="close-icon" icon="cancel" (click)="close()"></eco-icon>
  </div>
</div>
