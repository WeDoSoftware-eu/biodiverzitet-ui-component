<div class="map-wrapper rounded-16" [style.width]="width()" [style.height]="height()">
  <div class="top-container">
    <!-- Search Box -->
    @if (showSearchBox()) {
      <div class="map-search rounded-8">
        <input
          type="text"
          [(ngModel)]="searchQuery"
          (ngModelChange)="onSearchChange()"
          [placeholder]="i18n.map.search"
          class="search-input"
        />
        <eco-icon icon="search"></eco-icon>
      </div>
    }

    <!-- Layers Toggle Button -->
    @if (showFilterButton()) {
      <button type="button" class="control-button" aria-label="Filter button" title="Filter button">
        <eco-icon icon="tune"></eco-icon>
      </button>
    }
  </div>

  <div class="layers-controls">
    <!-- Layers Panel -->
    @if (showLayersPanel) {
      <div class="layers-panel rounded-16">
        <div class="layers-header">
          <h4>{{ i18n.map.layers.title }}</h4>
          <button
            type="button"
            (click)="toggleLayersPanel()"
            class="close-button rounded-full icon-32"
            aria-label="Close button"
          >
            ✕
          </button>
        </div>

        <div class="layers-grid">
          @for (layer of baseLayers; track layer.name) {
            <button
              type="button"
              (click)="switchLayer(layer)"
              class="layer-card"
              [class.active]="activeLayer.name === layer.name"
              aria-label="Layer card"
            >
              <div class="layer-preview">
                <img [src]="layer.thumbnail" [alt]="layer.name" />
              </div>
              <span class="layer-label">{{ layer.name }}</span>
            </button>
          }
        </div>
      </div>
    }

    <!-- Layers Toggle Button -->
    @if (showLayersButton()) {
      <button
        type="button"
        (click)="toggleLayersPanel()"
        class="control-button layers-button"
        [class.active]="showLayersPanel"
        aria-label="Change Map Layer"
        title="Change Map Layer"
      >
        <eco-icon icon="layers"></eco-icon>
      </button>
    }
  </div>

  <!-- Control Buttons -->
  <div class="map-controls">
    <div class="top-controls">
      <!-- Locate Me -->
      @if (showLocateButton()) {
        <button
          type="button"
          (click)="locateMe()"
          class="control-button locate-button"
          aria-label="Locate Me"
          title="Locate Me"
        >
          <eco-icon icon="gps"></eco-icon>
        </button>
      }
    </div>

    <div class="bottom-controls">
      <!-- FullScreen -->
      @if (showFullscreenButton()) {
        <button
          type="button"
          (click)="toggleFullscreen()"
          class="control-button locate-button"
          aria-label="Full Screen"
          title="Full Screen"
        >
          <eco-icon icon="full-screen"></eco-icon>
        </button>
      }

      <!-- Zoom Controls -->
      @if (showZoomControls()) {
        <div class="zoom-controls">
          <button
            type="button"
            (click)="zoomIn()"
            class="control-button zoom-button"
            title="Zoom In"
            aria-label="Zoom In"
          >
            <eco-icon icon="zoom-in"></eco-icon>
          </button>

          <button
            type="button"
            (click)="zoomOut()"
            class="control-button zoom-button"
            title="Zoom Out"
            aria-label="Zoom Out"
          >
            <eco-icon icon="zoom-out"></eco-icon>
          </button>
        </div>
      }
    </div>
  </div>

  <!-- Map Container -->
  <div #mapContainer class="map-container" [style.height]="height()"></div>
</div>
