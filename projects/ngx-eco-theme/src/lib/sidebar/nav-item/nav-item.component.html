<a
  [routerLink]="item()?.route"
  routerLinkActive="active-menu"
  [routerLinkActiveOptions]="{ exact: true }"
  (click)="onItemSelected(item()!)"
  [class.expanded]="expanded()"
  [class.subMenu]="!item()?.children"
  class="menu-list-item"
>
  <div class="icon-name-container">
    @if(item()?.children){
    <eco-icon [icon]="item()?.iconName!"></eco-icon>
    }
    <span class="hide-menu" [class.parentMenu]="item()?.children">{{ item()?.displayName }}</span>
  </div>

  @if(item()?.children){
  <div class="d-flex align-items-center gap-4 menu-icon">
    <eco-icon
      class="expand-icon"
      [@indicatorRotate]="expanded() ? 'expanded' : 'collapsed'"
      icon="arrow-down"
    ></eco-icon>
  </div>
  }
</a>

<div [@expanded]="expanded() ? 'expanded' : 'collapsed'">
  @for (child of item()?.children; track child) {
    <eco-nav-item [item]="child" (click)="onSubItemSelected(child)" [depth]="depth() + 1" />
  }
</div>
