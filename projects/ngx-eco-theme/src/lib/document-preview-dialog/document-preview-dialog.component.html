<div class="preview-dialog">
  <div class="preview-header">
    <span class="preview-title">{{ data.name }}</span>
    <button class="close-btn" type="button" (click)="close()">
      <eco-icon icon="cancel"></eco-icon>
    </button>
  </div>

  <div class="preview-content">
    @if (isPdf) {
      <iframe [src]="safePdfUrl"></iframe>
    } @else if (isImage) {
      <img [src]="safeImageUrl" [alt]="data.name" />
    } @else {
      <div class="preview-unsupported">
        <eco-icon icon="file-paper"></eco-icon>
        <p>{{ i18n.documentPreview.unsupportedPreview | async }}</p>
        <a [href]="data.url" [download]="data.name" class="download-link">
          <eco-icon icon="export"></eco-icon>
          {{ i18n.documentPreview.downloadFile | async }}
        </a>
      </div>
    }
  </div>
</div>
