<div class="preview-dialog">
  <div class="preview-dialog__header">
    <span class="preview-dialog__title">{{ data.name }}</span>
    <button class="preview-dialog__close-btn" type="button" (click)="close()">
      <eco-icon icon="cancel"></eco-icon>
    </button>
  </div>

  <div class="preview-dialog__content">
    @if (isPdf) {
      <iframe [src]="safePdfUrl" class="preview-dialog__iframe"></iframe>
    } @else if (isImage) {
      <img [src]="safeImageUrl" [alt]="data.name" class="preview-dialog__image" />
    } @else {
      <div class="preview-dialog__unsupported">
        <eco-icon icon="file-paper"></eco-icon>
        <p>{{ i18n.documentPreview.unsupportedPreview | async }}</p>
        <a [href]="data.url" [download]="data.name" class="preview-dialog__download-link">
          <eco-icon icon="export"></eco-icon>
          {{ i18n.documentPreview.downloadFile | async }}
        </a>
      </div>
    }
  </div>
</div>
