<mat-toolbar class="topbar p-20">
  @if (!showBackButton) {
    <button
      class="sidebar-toggle-btn rounded-full mobile-only m-r-8"
      aria-label="Навигациони мени"
      (click)="sidebarToggle.emit()"
    >
      <mat-icon class="hamburger">menu</mat-icon>
    </button>
  }

  <div class="topbar-left gap-2">
    <div>
      @if (showBackButton) {
        <button
          aria-label="Претходна страна"
          class="previous-btn rounded-full m-r-8"
          (click)="goBack()"
        >
          <eco-icon icon="back"></eco-icon>
        </button>
      }
    </div>
    <div>
      <h2 class="page-title">
        {{ title() }}
      </h2>
      <p class="page-subtitle mat-body-medium">
        {{ subtitle() }}
      </p>
    </div>
  </div>

  <span class="flex-spacer"></span>

  @if (!hideNotifications()) {
    <button
      aria-label="Обавештења"
      class="notification-btn rounded-full m-r-8"
      routerLink="/notifications"
    >
      <eco-icon icon="notifications"></eco-icon>
    </button>
  }

  <button class="mobile-menu-btn rounded-full" aria-label="Мени" (click)="mobileMenuToggle.emit()">
    <eco-icon icon="person"></eco-icon>
  </button>

  <eco-toggle
    class="m-r-8 desktop-only"
    labelOff="LAT"
    labelOn="ЋИР"
    [(ngModel)]="isCyrillic"
    (ngModelChange)="onLanguageToggle($event)"
  />

  <button
    mat-button
    aria-label="Профил"
    class="profile-btn desktop-only"
    [matMenuTriggerFor]="profilemenu"
  >
    <div class="profile-content">
      <div class="profile-info-inline">
        <div class="full-name-div d-flex">
          <span class="profile-name">{{ authUser?.fullName | async }}</span>

          <eco-icon icon="arrow-down" class="arrow-icon m-l-10"></eco-icon>
        </div>
        <span class="profile-role">{{ i18n.header.profile | async }}</span>
      </div>
    </div>
  </button>

  <!-- Profile menu -->
  <mat-menu
    #profilemenu="matMenu"
    xPosition="before"
    class="profile-menu-panel rounded-12 p-x-16 p-y-16 p-t-8"
  >
    <div>
      <div class="d-flex text-left p-y-8">
        <div>
          <h6 class="mat-body-medium">{{ authUser?.fullName | async }}</h6>
          <span class="mat-body-medium">{{ authUser?.email | async }}</span>
        </div>
      </div>
    </div>
    <mat-divider class="devider"></mat-divider>
    <div class="profile-links-container">
      @for (profile of profileLinks; track profile.id) {
        <a [routerLink]="profile.link || null" (click)="handleProfileClick(profile, $event)">
          <div class="menu-item d-flex align-items-center p-x-12 p-y-4 rounded-10">
            <eco-icon class="mat-headline-medium m-r-16 m-b-0" [icon]="profile.icon"></eco-icon>
            <h5 class="mat-body-medium m-0">{{ profile.title | async }}</h5>
          </div>
        </a>
      }
    </div>
  </mat-menu>
</mat-toolbar>
