<div class="modal-header">
  <div class="title d-flex">
    @if (data.severity) {
      <span
        class="card-severity rounded-8 m-r-8"
        [attr.data-severity]="data.severity"
        aria-hidden="true"
      >
        <eco-icon [icon]="data.severity === 'warning' ? 'warrning' : 'delete'" />
      </span>
    }
    <div class="text-container">
      <h2 class="mat-headline-medium">{{ data.title | async }}</h2>
      <p class="mat-body-small modal-subtitle">{{ data.subtitle | async }}</p>
    </div>
    <div class="chip-container m-l-4">
      @if (data.chipHeader) {
        <div class="d-flex">
          @for (chip of data.chipHeader; track chip.text) {
            <eco-chip class="m-l-4" [status]="chip.status" [icon]="chip.icon">{{
              chip.text | async
            }}</eco-chip>
          }
        </div>
      }
    </div>
  </div>
  <button mat-icon-button mat-dialog-close class="close-button" [attr.aria-label]="i18n.modal.close | async">
    <eco-icon icon="cancel"></eco-icon>
  </button>
</div>

<mat-dialog-content>
  <ng-template #dynamicComponentContainer></ng-template>
</mat-dialog-content>

<mat-dialog-actions>
  @if (data.mode !== 'view') {
    <eco-button (click)="save()" buttonClass="primary" icon="correct">{{
      i18n.modal.save | async
    }}</eco-button>
  }
</mat-dialog-actions>
