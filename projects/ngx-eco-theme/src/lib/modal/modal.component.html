<div class="modal-header">
  <div class="title d-flex">
    <div class="text-container">
      <h2 class="mat-headline-medium">{{ data.title }}</h2>
      <p class="mat-body-small modal-subtitle">{{ data.subtitle }}</p>
    </div>
    <div class="chip-container m-l-8">
      @if (data.chipHeader) {
        <div class="d-flex">
          @for (chip of data.chipHeader; track chip.text) {
            <eco-chip [status]="chip.status" [icon]="chip.icon">{{ chip.text }}</eco-chip>
          }
        </div>
      }
    </div>
  </div>
  <button mat-icon-button mat-dialog-close class="close-button">
    <eco-icon icon="cancel"></eco-icon>
  </button>
</div>

<mat-dialog-content>
  <ng-template #dynamicComponentContainer></ng-template>
</mat-dialog-content>

<mat-dialog-actions>
  @if (data.mode !== 'view') {
    <eco-button (click)="save()" buttonClass="primary" icon="correct">{{
      i18n.modal.save
    }}</eco-button>
  }
</mat-dialog-actions>
