<div class="search-container">
  <input
    type="text"
    class="search-input"
    [placeholder]="placeholder()"
    [value]="searchValue()"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
    aria-label="Pretraga"
  />
  <button class="search-button" (click)="onSearch()" aria-label="Pretrazi" type="button">
    <eco-icon [icon]="'search'" />
  </button>
</div>
