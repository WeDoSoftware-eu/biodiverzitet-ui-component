<div class="search-container">
  <input
    type="text"
    class="search-input"
    [placeholder]="placeholder()"
    [value]="searchValue()"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
    [attr.aria-label]="i18n.map.search | async"
  />
  <button class="search-button" (click)="onSearch()" [attr.aria-label]="i18n.map.search | async" type="button">
    <eco-icon [icon]="'search'" />
  </button>
</div>
