<div class="map-status-bar">
  <div class="bar-section">
    <span class="epsg-code">{{ epsgCode() }}</span>
  </div>

  <div class="bar-section">
    @if (coordinates()) {
      <span class="coordinates"> {{ formattedNorthing() }} {{ formattedEasting() }} </span>
    } @else {
      <span class="coordinates coordinates--empty">-, -</span>
    }
  </div>

  <div class="bar-section scale-bar">
    <div class="scale-line" [style.width.px]="scaleBarConfig().widthPx">
      <div class="scale-tick scale-tick--left"></div>
      <div class="scale-tick scale-tick--right"></div>
    </div>
    <span class="scale-label">{{ scaleBarConfig().label }}</span>
  </div>
</div>
