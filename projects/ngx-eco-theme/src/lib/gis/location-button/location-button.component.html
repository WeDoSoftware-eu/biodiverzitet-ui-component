<div class="location-container" [class.active]="isActive()">
  <button
    class="location-button"
    [class.active]="isActive()"
    (click)="onClick()"
    aria-label="Pronadi moju lokaciju"
    title="Moja lokacija"
    type="button"
  >
    <span class="icon">
      <eco-icon [icon]="'gps'" />
    </span>
  </button>
</div>
