<div class="location-container" [class.active]="isActive()">
  <button
    class="location-button"
    [class.active]="isActive()"
    (click)="onClick()"
    [attr.aria-label]="i18n.map.buttons.location | async"
    [title]="(i18n.map.buttons.location | async) ?? ''"
    type="button"
  >
    <span class="icon">
      <eco-icon [icon]="'gps'" />
    </span>
  </button>
</div>
