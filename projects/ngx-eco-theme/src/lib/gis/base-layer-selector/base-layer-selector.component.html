<div class="base-layer-selector">
  <div class="header">
    <span class="title">Подлоге</span>
    <button class="close-button" (click)="onClose()" aria-label="Zatvori">
      <eco-icon [icon]="'cancel'" />
    </button>
  </div>

  <div class="layers">
    <div class="base-layer-option">
      <button
        class="base-layer-button"
        [class.selected]="selectedLayer() === 'map'"
        (click)="selectLayer('map')"
        aria-label="Карта"
      >
        <img src="assets/images/osm.jpg" alt="OSM Karta" class="base-layer-image" />
      </button>
      <span class="base-layer-label">Карта</span>
    </div>

    <div class="base-layer-option">
      <button
        class="base-layer-button"
        [class.selected]="selectedLayer() === 'satellite'"
        (click)="selectLayer('satellite')"
        aria-label="Сателит"
      >
        <img src="assets/images/satelite.jpg" alt="Satelit" class="base-layer-image" />
      </button>
      <span class="base-layer-label">Сателит</span>
    </div>
  </div>
</div>
