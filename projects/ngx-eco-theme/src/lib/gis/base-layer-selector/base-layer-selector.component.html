<div class="base-layer-selector">
  <div class="header">
    <span class="title">{{ i18n.map.baseLayers.title | async }}</span>
    <button class="close-button" (click)="onClose()" [attr.aria-label]="i18n.map.buttons.close | async">
      <eco-icon [icon]="'cancel'" />
    </button>
  </div>

  <div class="layers">
    <div class="base-layer-option">
      <button
        class="base-layer-button"
        [class.selected]="selectedLayer() === 'map'"
        (click)="selectLayer('map')"
        [attr.aria-label]="i18n.map.baseLayers.map | async"
      >
        <img src="assets/images/osm.jpg" alt="OSM Karta" class="base-layer-image" />
      </button>
      <span class="base-layer-label">{{ i18n.map.baseLayers.map | async }}</span>
    </div>

    <div class="base-layer-option">
      <button
        class="base-layer-button"
        [class.selected]="selectedLayer() === 'satellite'"
        (click)="selectLayer('satellite')"
        [attr.aria-label]="i18n.map.baseLayers.satellite | async"
      >
        <img src="assets/images/satelite.jpg" alt="Satelit" class="base-layer-image" />
      </button>
      <span class="base-layer-label">{{ i18n.map.baseLayers.satellite | async }}</span>
    </div>
  </div>
</div>
