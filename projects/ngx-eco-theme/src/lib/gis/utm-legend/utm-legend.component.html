<div class="utm-legend">
  <div class="header">
    <span class="title">{{ title() || (i18n.map.utmLegend.title | async) }}</span>
    <button class="close-button" (click)="onClose()" [attr.aria-label]="i18n.map.buttons.close | async">
      <eco-icon [icon]="'cancel'" />
    </button>
  </div>

  <div class="legend-list">
    @for (item of items(); track item.name) {
      <div class="legend-item">
        <span class="legend-symbol">
          @if (item.isOverlap) {
            <span class="symbol-overlap"></span>
          } @else {
            <span
              class="symbol-fill"
              [style.background-color]="item.color"
              [style.opacity]="'0.6'"
            ></span>
          }
        </span>
        <span class="legend-name">{{ item.name }}</span>
      </div>
    }

    @if (items().length === 0) {
      <div class="no-items">{{ i18n.map.utmLegend.noActiveFilters | async }}</div>
    }
  </div>
</div>
