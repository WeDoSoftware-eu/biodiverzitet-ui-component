<div class="map-controls-container">
  <div class="buttons-container">
    <button
      class="control-btn"
      [class.clicked]="zoomInClicked()"
      (click)="onZoomIn()"
      aria-label="Zoom in"
      title="Uvećaj"
    >
      <eco-icon [icon]="'zoom-in'" />
    </button>

    <button
      class="control-btn"
      [class.clicked]="zoomOutClicked()"
      (click)="onZoomOut()"
      aria-label="Zoom out"
      title="Umanji"
    >
      <eco-icon [icon]="'zoom-out'" />
    </button>

    <button
      class="control-btn"
      [class.clicked]="homeViewClicked()"
      (click)="onHomeViewClick()"
      aria-label="Početni pogled"
      title="Početni pogled"
    >
      <eco-icon [icon]="'home-view'" />
    </button>
  </div>

  <div class="divider"></div>

  <button class="control-btn" (click)="onFullscreen()" aria-label="Fullscreen" title="Ceo ekran">
    <eco-icon [icon]="'full-screen'" />
  </button>
</div>
