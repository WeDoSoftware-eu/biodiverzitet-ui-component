<div class="map-controls-container">
  <div class="buttons-container">
    <button
      class="control-btn"
      [class.clicked]="zoomInClicked()"
      (click)="onZoomIn()"
      aria-label="Zoom in"
      [title]="(i18n.map.buttons.zoomIn | async) ?? ''"
    >
      <eco-icon [icon]="'zoom-in'" />
    </button>

    <button
      class="control-btn"
      [class.clicked]="zoomOutClicked()"
      (click)="onZoomOut()"
      aria-label="Zoom out"
      [title]="(i18n.map.buttons.zoomOut | async) ?? ''"
    >
      <eco-icon [icon]="'zoom-out'" />
    </button>

    <button
      class="control-btn"
      [class.clicked]="homeViewClicked()"
      (click)="onHomeViewClick()"
      [attr.aria-label]="i18n.map.buttons.homeView | async"
      [title]="(i18n.map.buttons.homeView | async) ?? ''"
    >
      <eco-icon [icon]="'home-view'" />
    </button>
  </div>

  <div class="divider"></div>

  <button class="control-btn" (click)="onFullscreen()" aria-label="Fullscreen" [title]="(i18n.map.buttons.fullscreen | async) ?? ''">
    <eco-icon [icon]="'full-screen'" />
  </button>
</div>
