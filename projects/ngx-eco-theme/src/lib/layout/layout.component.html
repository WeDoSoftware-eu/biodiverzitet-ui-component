<mat-drawer-container class="layout-container">
  <mat-drawer mode="side" opened class="side-container">
    <eco-sidebar [brandingTitle]="brandingTitle()"></eco-sidebar>
    <eco-button icon="person" buttonClass="secondary">
      <a routerLink="/admin">{{ i18n.sideBar.adminPanel }}</a>
    </eco-button>
  </mat-drawer>
  <mat-drawer-content class="content-container">
    <eco-header [title]="title()" [subtitle]="subtitle()"></eco-header>
    <main class="components-route">
      <ng-content></ng-content>
    </main>
  </mat-drawer-content>
</mat-drawer-container>
