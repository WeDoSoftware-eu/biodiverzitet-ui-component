<div class="paginator-container">
  @if (totalPages() > 0) {
    <div class="custom-paginator-controls gap-8">
      <div class="last-update-text">
        @if (showLastUpdate()) {
          {{ latUpdateTitle }}:
          <p class="m-l-5">{{ latUpdate() }}</p>
        }
      </div>

      <div class="pagination-buttons gap-6">
        <button
          class="rounded-2"
          mat-mini-fab
          (click)="changePage('first')"
          [matTooltip]="i18n.paginator.firstPage"
          [disabled]="pageIndex() === 0"
          aria-label="First page"
        >
          <eco-icon class="icon-16" icon="first-page"></eco-icon>
        </button>

        <button
          class="rounded-2"
          mat-mini-fab
          (click)="changePage(-1)"
          [matTooltip]="i18n.paginator.previousPage"
          [disabled]="pageIndex() === 0"
          aria-label="Previous page"
        >
          <eco-icon class="icon-16" icon="previous-page"></eco-icon>
        </button>

        @for (page of pagesToDisplay(); track $index) {
          @if (page === '...') {
            <button mat-mini-fab class="rounded-2">...</button>
          } @else {
            <button
              class="rounded-2"
              mat-mini-fab
              [class.active-page]="page === pageIndex() + 1"
              [matTooltip]="i18n.paginator.page + page"
              (click)="goToPage(page)"
            >
              {{ page }}
            </button>
          }
        }

        <button
          class="rounded-2"
          mat-mini-fab
          (click)="changePage(1)"
          [matTooltip]="i18n.paginator.nextPage"
          [disabled]="pageIndex() === totalPages() - 1"
          aria-label="Next page"
        >
          <eco-icon class="icon-16" icon="next-page"></eco-icon>
        </button>

        <button
          class="rounded-2"
          mat-mini-fab
          (click)="changePage('last')"
          [matTooltip]="i18n.paginator.lastPage"
          [disabled]="pageIndex() === totalPages() - 1"
          aria-label="Last page"
        >
          <eco-icon class="icon-16" icon="last-page"></eco-icon>
        </button>

        <div class="goto-page-container gap-6 m-l-20">
          <p class="mat-body-medium">{{ i18n.paginator.goTo }}</p>
          <input
            class="rounded-2"
            type="number"
            [(ngModel)]="pageInput"
            min="1"
            [max]="totalPages()"
            (ngModelChange)="goToPage(pageInput)"
          />
          <p class="mat-body-medium">{{ i18n.paginator.side }}</p>
        </div>
      </div>

      <div class="generate-button">
        @if (generateButtonShow()) {
          <eco-button buttonClass="primary" icon="starts">Генериши извештај</eco-button>
        }
      </div>
    </div>
  }
</div>
