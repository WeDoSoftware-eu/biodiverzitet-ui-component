<div class="search-container">
  <mat-form-field class="search-field" subscriptSizing="dynamic">
    <input
      matInput
      [placeholder]="(i18n.tableSerach.search | async) ?? ''"
      [(ngModel)]="searchText"
      (ngModelChange)="searchTextChange($event)"
    />
    <eco-icon icon="search" matSuffix></eco-icon>
  </mat-form-field>
</div>
