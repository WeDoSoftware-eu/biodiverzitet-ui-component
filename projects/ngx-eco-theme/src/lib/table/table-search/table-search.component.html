<div class="search-container">
  <mat-form-field class="search-field" subscriptSizing="dynamic">
    <mat-label>{{ i18n.tableSerach.search() }}</mat-label>
    <input matInput [(ngModel)]="searchText" (ngModelChange)="searchTextChange($event)" />
    <eco-icon icon="search" matSuffix></eco-icon>
  </mat-form-field>
</div>
