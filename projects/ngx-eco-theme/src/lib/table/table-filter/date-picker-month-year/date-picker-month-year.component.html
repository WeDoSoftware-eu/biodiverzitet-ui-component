<mat-form-field class="datepicker-month-year" subscriptSizing="dynamic" appearance="outline">
  <input
    matInput
    [placeholder]="placeholder()"
    [matDatepicker]="pickerMonthYear"
    [formControl]="control()"
  />
  <span matIconSuffix class="suffix-icons">
    <button
      mat-icon-button
      type="button"
      class="clear-button"
      [style.visibility]="hasValue() ? 'visible' : 'hidden'"
      [attr.aria-label]="i18n.datePicker.clearDateLabel | async"
      (click)="clearDate(); $event.stopPropagation()"
    >
      <eco-icon icon="cancel"></eco-icon>
    </button>
    <mat-datepicker-toggle [for]="pickerMonthYear" class="calendar-toggle"></mat-datepicker-toggle>
  </span>
  <mat-datepicker
    #pickerMonthYear
    startView="multi-year"
    (monthSelected)="setMonthAndYear($event, pickerMonthYear)"
  ></mat-datepicker>
</mat-form-field>
