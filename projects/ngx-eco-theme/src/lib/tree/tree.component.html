<mat-tree #tree [dataSource]="dataSource()" [childrenAccessor]="childrenAccessor" class="tree">
  <!-- This is the tree node template for leaf nodes -->
  <!-- There is inline padding applied to this node using styles.
    This padding value depends on the mat-icon-button width. -->
  <mat-tree-node
    *matTreeNodeDef="let node"
    (click)="$event.preventDefault(); $event.stopPropagation()"
  >
    {{ node.name }}
  </mat-tree-node>
  <!-- This is the tree node template for expandable nodes -->
  <mat-nested-tree-node
    *matTreeNodeDef="let node; when: hasChild"
    matTreeNodeToggle
    [cdkTreeNodeTypeaheadLabel]="node.name"
  >
    <div class="mat-tree-node">
      <button mat-icon-button matTreeNodeToggle [attr.aria-label]="'Toggle ' + node.name">
        <eco-icon
          [icon]="tree.isExpanded(node) ? 'do-not-disturb-on' : 'expand-circle-down'"
        ></eco-icon>
      </button>
      {{ node.name }}
    </div>
    <!-- There is inline padding applied to this div using styles.
        This padding value depends on the mat-icon-button width.  -->
    <div
      [class.tree-invisible]="!hasViewInitialized()"
      [@expanded]="tree.isExpanded(node) ? 'expanded' : 'collapsed'"
      role="group"
    >
      <ng-container matTreeNodeOutlet></ng-container>
    </div>
  </mat-nested-tree-node>
</mat-tree>
